name: Publicar POS de escritorio

# Cada push a main que cambie la app (client/ o desktop/) compila el instalador de
# Windows y lo publica en GitHub Releases con una version nueva (vX.Y.Z+1).
# Las apps instaladas lo detectan al abrirse y cada 4 horas (electron-updater).
# La version se calcula sola: la ultima publicada + 1 en el patch. Para saltar a
# otra serie (ej. 1.1.0) basta con subir la version en desktop/package.json.
on:
  push:
    branches:
      - main
    paths:
      - client/**
      - '!client/public/movil/**'
      - desktop/**
      - .github/workflows/desktop-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Calcular la nueva version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $base = [version](Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tags = gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName'
          $ultima = $tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]$_.Substring(1) } | Sort-Object -Descending | Select-Object -First 1
          $nueva = if (-not $ultima -or $base -gt $ultima) { $base } else { [version]::new($ultima.Major, $ultima.Minor, $ultima.Build + 1) }
          Write-Host "Ultima publicada: $ultima -> nueva: $nueva"
          "version=$nueva" >> $env:GITHUB_OUTPUT

      - name: Aplicar la version al paquete
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version
        working-directory: desktop

      - run: npm ci
        working-directory: client

      - run: npm ci
        working-directory: desktop

      - name: Compilar y publicar
        run: npm run dist -- --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
