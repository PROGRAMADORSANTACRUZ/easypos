# Preserva el X-Forwarded-Proto real que manda Traefik (https) en vez de
# recalcularlo con $scheme (que acá siempre sería "http": Traefik se conecta
# a este contenedor por HTTP plano interno) — necesario para que Express vea
# la conexión como segura (cookies/redirects que dependan de https).
map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $real_scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
