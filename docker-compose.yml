# POS para Dokploy. La base de datos es EXTERNA (Postgres, crear como app
# "Database" aparte en Dokploy) — este stack solo trae el contenedor de la app
# (nginx sirviendo el build de client/ + backend Express en :4000 dentro del
# mismo contenedor). Para desarrollo local usar docker-compose.dev.yml en su lugar.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Vacío = el frontend llama a /api en el mismo dominio (vía Nginx).
        VITE_API_URL: /api
    container_name: pos-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # nginx.conf es una plantilla que toma este mismo valor en runtime
      # (start.sh + envsubst), así que cambiarlo acá basta para los dos.
      PORT: ${PORT:-4000}
      # Conexión "por defecto" (requests sin header x-tenant-id, scripts, seed)
      # y también la base de PLATAFORMA (directorio de restaurantes) — se
      # unifican en UNA sola base (sin colisión de nombres de tabla entre los
      # 2 esquemas de Prisma), así solo hay que configurar DATABASE_URL.
      DATABASE_URL: ${DATABASE_URL}
      PLATFORM_DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      IVA_PCT: ${IVA_PCT:-19}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      FACTUS_BASE_URL: ${FACTUS_BASE_URL:-https://api-sandbox.factus.com.co}
      FACTUS_CLIENT_ID: ${FACTUS_CLIENT_ID:-}
      FACTUS_CLIENT_SECRET: ${FACTUS_CLIENT_SECRET:-}
      FACTUS_USER: ${FACTUS_USER:-}
      FACTUS_PASSWORD: ${FACTUS_PASSWORD:-}
      FACTUS_NUMBERING_RANGE_FACTURA: ${FACTUS_NUMBERING_RANGE_FACTURA:-}
      FACTUS_NUMBERING_RANGE_NOTA_CREDITO: ${FACTUS_NUMBERING_RANGE_NOTA_CREDITO:-}
      # La inicializacion y el seed se ejecutan manualmente al crear una
      # instalacion; nunca al reiniciar un servicio con datos reales.
      RUN_DB_INIT: "false"
      RUN_SEED: "false"
    networks:
      - dokploy-network
    labels:
      - "dokploy.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.pos.rule=Host(`pos.grupo-santacruz.com`)"
      - "traefik.http.routers.pos.entrypoints=websecure"
      - "traefik.http.routers.pos.tls=true"
      - "traefik.http.routers.pos.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pos.service=pos"
      - "traefik.http.services.pos.loadbalancer.server.port=80"
      - "traefik.http.routers.pos-web.rule=Host(`pos.grupo-santacruz.com`)"
      - "traefik.http.routers.pos-web.entrypoints=web"
      - "traefik.http.routers.pos-web.middlewares=pos-redirect-https"
      - "traefik.http.routers.pos-web.service=pos"
      - "traefik.http.middlewares.pos-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.pos-redirect-https.redirectscheme.permanent=true"
      - "traefik.docker.network=dokploy-network"

networks:
  dokploy-network:
    external: true
